name: docs-integrity

on: [push, pull_request]

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check documentation integrity
        run: |
          python - <<'PY'
          import pathlib
          import re
          import sys

          # The router is the only reason the correct reference file loads, so
          # its trigger vocabulary never trades down for bytes. Raised at 1.5.0,
          # after the duplicated split paragraphs came out and the remaining
          # content was all triggers. Raised again at 1.7.0, where two router
          # rows and one gate block for domain 08 passed the old number.
          # Raised again at 1.9.0, where four router rows, seven seam rows,
          # and a blocking gate block for domain 10 passed it. Raised again
          # at 1.11.0, where three router rows, six seam rows, and a gate
          # block for domain 12 passed it. Raised again at 1.12.0, where
          # three router rows, seven seam rows, and a gate block for domain
          # 13 passed it. Raised again at 1.13.0, where three router rows,
          # seven seam rows, and a gate block for domain 14 passed it.
          # Raised again at 1.14.0, where three router rows, eleven seam
          # rows, and a gate block for domain 15 passed it. Raised again
          # at 1.15.0, where three router rows, eleven seam rows, and a
          # gate block for domain 16 passed it. Each domain adds about
          # 6 kB of rows, seams, and gate conditions, and 8 domains
          # remain, so this number moves on that schedule. It is
          # a tripwire against depth that belongs in references/, and not a
          # budget. This is a repository gate, not a platform limit; the
          # platform limit is the frontmatter description, which the
          # validate-skill workflow checks at 1024 characters.
          MAX_SKILL_BYTES = 131072
          REFERENCE_LINK = re.compile(r"references/([A-Za-z0-9._-]+\.md)")

          root = pathlib.Path(".")
          skill = root / "SKILL.md"
          references = root / "references"

          errors = []

          # Checks 1 and 2 are no-ops until reference files exist.
          reference_files = sorted(references.glob("*.md")) if references.is_dir() else []

          cited = {}
          for source in [skill] + reference_files:
              text = source.read_text(encoding="utf-8")
              for name in REFERENCE_LINK.findall(text):
                  cited.setdefault(name, set()).add(source.as_posix())

          # 1. Every referenced file resolves on disk.
          for name, citers in sorted(cited.items()):
              if not (references / name).is_file():
                  where = ", ".join(sorted(citers))
                  errors.append(
                      f"{where}: links to references/{name}, which does not exist on disk"
                  )

          # 2. Every reference file is cited by something other than itself.
          for path in reference_files:
              if not cited.get(path.name, set()) - {path.as_posix()}:
                  errors.append(
                      f"{path.as_posix()}: orphaned, no link to it from SKILL.md "
                      f"or any other reference file"
                  )

          # 3. Code fences are balanced in every Markdown file.
          for path in sorted(root.rglob("*.md")):
              if ".git" in path.parts:
                  continue
              fences = sum(
                  1
                  for line in path.read_text(encoding="utf-8").splitlines()
                  if line.startswith("```")
              )
              if fences % 2:
                  errors.append(
                      f"{path.as_posix()}: odd number of code fence lines ({fences}), "
                      f"so a fence is never closed"
                  )

          # 4. SKILL.md stays under the size ceiling.
          size = skill.stat().st_size
          if size > MAX_SKILL_BYTES:
              errors.append(
                  f"SKILL.md: {size} bytes exceeds the limit of {MAX_SKILL_BYTES} bytes"
              )

          if errors:
              sys.exit(
                  "Documentation integrity check failed:\n"
                  + "\n".join(f"  - {e}" for e in errors)
              )

          print(
              f"Documentation integrity OK: {len(reference_files)} reference file(s), "
              f"SKILL.md {size}/{MAX_SKILL_BYTES} bytes"
          )
          PY
